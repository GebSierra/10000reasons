<style>
  :root {
    --ui-bg: rgba(28, 30, 34, 0.42); --ui-ring: rgba(255, 255, 255, 0.55); --ui-fg: #fff;

    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  html, body { margin: 0; height: 100%; background: #9cc8e6; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none;
         -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas.looking { cursor: grabbing; }

  /* joystick: big touch target, visible base + knob */
  #stick { position: fixed; z-index: 3; width: 168px; height: 168px; touch-action: none;
           left: calc(18px + var(--safe-l)); bottom: calc(18px + var(--safe-b)); cursor: pointer; }
  #stick .base { position: absolute; inset: 16px; border-radius: 50%; background: var(--ui-bg);
                 border: 2px solid var(--ui-ring); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
                 box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  #stick .knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px;
                 border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 3px 12px rgba(0,0,0,.3);
                 transition: transform .12s ease-out; }
  #stick.active .knob { transition: none; }
  #stick .tick { position: absolute; left: 50%; width: 0; height: 0; margin-left: -6px; border: 6px solid transparent; opacity: .8; }
  #stick .tick.up { top: 24px; border-bottom-color: #fff; border-top: 0; }
  #stick .tick.dn { bottom: 24px; border-top-color: #fff; border-bottom: 0; }

  .chip { position: fixed; z-index: 3; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%;
          background: var(--ui-bg); border: 1.5px solid var(--ui-ring); color: var(--ui-fg); cursor: pointer;
          backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 0; }
  .chip:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #home { top: calc(14px + var(--safe-t)); right: calc(14px + var(--safe-r)); }
  #full { top: calc(14px + var(--safe-t)); right: calc(70px + var(--safe-r)); }
  #doll { top: calc(14px + var(--safe-t)); right: calc(126px + var(--safe-r)); }
  #auto { top: calc(14px + var(--safe-t)); right: calc(182px + var(--safe-r)); }
  body.touring #stick, body.touring #hint, body.touring #plan { display: none !important; }
  #fade { position: fixed; inset: 0; z-index: 4; background: #000; opacity: 0; pointer-events: none; transition: opacity .9s ease; }
  #fade.on { opacity: 1; }
  #roomcap { position: fixed; z-index: 4; left: calc(24px + var(--safe-l)); bottom: calc(24px + var(--safe-b)); padding: 12px 20px; border-radius: 12px;
             background: rgba(20,22,26,.5); color: #fff; font: 600 clamp(18px, 2.4vw, 30px)/1.2 system-ui, -apple-system, sans-serif; letter-spacing: .01em;
             backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .9s ease; pointer-events: none; }
  #roomcap.on { opacity: 1; }
  #pledge { position: fixed; z-index: 4; right: calc(24px + var(--safe-r)); bottom: calc(24px + var(--safe-b)); padding: 12px 20px; border-radius: 12px;
            background: rgba(234,83,60,.92); color: #fff; font: 600 clamp(14px, 1.7vw, 22px)/1.3 system-ui, -apple-system, sans-serif; text-align: right;
            display: none; pointer-events: none; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  #pledge b { display: block; font-weight: 800; }
  body.touring #pledge { display: block; }
  @media (max-width: 560px) { #pledge { font-size: 12px; padding: 8px 12px; } #roomcap { font-size: 15px; padding: 8px 12px; bottom: calc(72px + var(--safe-b)); } }
  .chip.on { background: rgba(255,255,255,.92); color: #1c1e22; }
  /* one gentle nudge on the dollhouse chip after the tour first opens */
  @keyframes dollNudge { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    25% { transform: scale(1.12); box-shadow: 0 0 0 6px rgba(255,255,255,.28); }
    50% { transform: scale(.98); box-shadow: 0 0 0 10px rgba(255,255,255,0); } 70% { transform: scale(1.05); } }
  #doll.nudge { animation: dollNudge 1.1s ease-in-out 2; }

  @keyframes dollLift { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { #doll.nudge, #doll.nudge svg { animation: none; } }
  body.dollmode #stick { display: none; }
  /* floor plan download: a quiet pill that only appears in the dollhouse view */
  #plan { position: fixed; z-index: 3; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); display: none;
          align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; text-decoration: none;
          background: var(--ui-bg); border: 1.5px solid var(--ui-ring); color: var(--ui-fg); font: 600 14px system-ui, -apple-system, sans-serif;

          background: rgba(20,22,26,.55); color: #fff; font-size: 14px; line-height: 1.4;

  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;

  .shot #stick, .shot .chip, .shot #hint { display: none; }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- URL controls (dev): ?cam=x,z,yawDeg,pitchDeg starts the walker there (and hides the UI for screenshots
// unless &ui=1), ?hud=1 shows position + room + fps, ?q=low|high forces a quality tier
const P = new URLSearchParams(location.search);
const CAMP = P.get('cam')?.split(',').map(Number);
if (CAMP && P.get('ui') !== '1') document.body.classList.add('shot');
if (P.get('hud') === '1') document.getElementById('hud').style.display = 'block';

// ---------- quality tier: phones/tablets get a lighter pipeline so they hold a smooth frame rate
const COARSE = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
const LOW = P.get('q') === 'low' || (P.get('q') !== 'high' && COARSE);
const Q = LOW
  ? { dpr: Math.min(devicePixelRatio, 1.5), shadow: 2048, ao: false, sky: 1024, lights: 4, bloom: 0.42 }
  : { dpr: Math.min(devicePixelRatio, 2), shadow: 4096, ao: true, sky: 2048, lights: 8, bloom: 0.58 };

// ---------- seeded random + value noise
let seed = 1337;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const R = (a, b) => a + (b - a) * rnd();
function hash(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) & 0xffff) / 0xffff; }
function vnoise(x, y, wrap) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const w = wrap || 1e9, m = v => ((v % w) + w) % w;
  const a = hash(m(xi), yi), b = hash(m(xi + 1), yi), c = hash(m(xi), yi + 1), d = hash(m(xi + 1), yi + 1);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct, wrap) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, wrap ? wrap * f : 0); a *= 0.5; f *= 2; } return s; }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, srgb = true, rep = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8; return t;
}
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

// =====================================================================================================
// FLOOR PLAN (sheet A.1R, 11/04/2026) — the authoritative layout.
// Plan coordinates are FEET: px = feet east of the WEST wall, py = feet south of the NORTH wall.
// World: metres, +x = east, -z = north, y = up. The front (south) wall sits at z = FZ.
// The vestibule's centre line is world x = 0.
// =====================================================================================================
// sheet A.1R (final): 129'-2" x 75'-9", vestibule 24'-11" x 8'-8" centred on world x = 0
const FT = 0.3048, PW = 129.17, PD = 75.75, VCX = 72.03;
const FZ = -18;
const px = f => (f - VCX) * FT;                 // plan feet (from west wall) -> world x
const pz = f => FZ - (PD - f) * FT;             // plan feet (from north wall) -> world z
const BX0 = px(0), BX1 = px(PW), BZN = pz(0), BD = PD * FT;          // building: x -22.82..14.92, z -42.03..-18
const WALL_H = 6.4, RISE = 3.0, ZR = FZ - BD / 2;                     // eave height, 3:12 gable, ridge runs east-west
// The worship area is a TALL wing (client reference: gym-height sanctuary with clerestories and hoops). It spans
// x BX0..WX1, z ZWN..FZ; its gable ridge stays on the building ridge line ZR (so the north and south pitches differ).
// The storage strip north of it gets a low shed roof so the worship north wall carries clerestory windows.
const WX1 = px(57.33), ZWN = pz(8.67);
const EHW = 8.6, RISEW = 3.4, STOR_H = 3.8;           // wing eave, wing roof rise, storage strip wall height
const wingTop = z => EHW + RISEW * (1 - (z < ZR ? (ZR - z) / (ZR - ZWN) : (z - ZR) / (FZ - ZR)));   // wing roof deck underside
const mainTop = z => WALL_H + RISE * (1 - Math.abs(z - ZR) / (BD / 2));                               // main roof deck underside
const ceilY = z => wingTop(z) - 0.3;                  // worship ceiling (white vault) at z
const EXT_T = 0.25, INT_T = 0.15, DOOR_H = 2.13;

// rooms: [plan x0, y0, x1, y1] in feet, ceiling height (m) or 'vault', floor finish
const ROOM_PLAN = {
  mech:       [0, 64.3, 13, 75.75, 3.0, 'concrete'],
  worship:    [0, 8.67, 57.33, 75.75, 'vault', 'carpet'],
  storage:    [0, 0, 48.67, 8.67, 3.0, 'concrete'],
  kitchen:    [57.33, 0, 71.42, 26.5, 2.75, 'tile'],
  kitchenN:   [48.67, 0, 57.33, 8.67, 2.75, 'tile'],     // kitchen's north-west leg (the 8'-8" strip beside storage)
  office:     [71.42, 0, 86, 18.42, 2.75, 'carpet'],       // pastor's office, 14'-7" x 18'-5" (copy room removed)
  reception:  [71.42, 18.42, 86, 31.33, 2.75, 'oak'],      // reception / printing: open to the fellowship hall on the south
  coffee:     [57.33, 26.5, 71.42, 31.33, 2.75, 'oak'],    // bookstore strip south of the kitchen, out to the worship wall
  mtg:        [86, 0, 103.08, 21.67, 2.75, 'carpet'],      // Family Bible Fellowship (adult Bible study), 17'-1" x 21'-8"
  childbath:  [86, 21.67, 98, 35.75, 2.75, 'tile'],
  hall:       [86, 35.75, 98, 40.8, 2.75, 'oak'],          // short hall: fellowship hall -> corridor, between child bath and women
  women:      [86, 40.8, 98, 58.2, 2.75, 'tile'],
  men:        [86, 58.2, 98, 75.75, 2.75, 'tile'],
  classroom:  [103.08, 0, 129.17, 23.1, 2.75, 'carpet'],
  exithall:   [103.08, 23.1, 129.17, 28.2, 2.75, 'oak'],
  corridor:   [98, 21.67, 103.08, 58.6, 2.75, 'oak'],      // runs from the Family Bible Fellowship door down to the nursery
  k45:        [103.08, 28.2, 129.17, 43.4, 2.75, 'carpet'],
  k23:        [103.08, 43.4, 129.17, 58.6, 2.75, 'carpet'],
  nursery:    [98, 58.6, 129.17, 75.75, 2.75, 'carpet'],
  fellowship: [57.33, 31.33, 86, 75.75, 3.66, 'oak'],
  vestibule:  [59.57, 75.75, 84.5, 84.42, 3.0, 'tile'],
};
const ROOMS = {};   // world rects { x0, z0, x1, z1, h, floor }
for (const [k, [a, b, c, d, h, f]] of Object.entries(ROOM_PLAN)) ROOMS[k] = { x0: px(a), z0: pz(b), x1: px(c), z1: pz(d), h, floor: f };
// sub-rects that belong to a larger room (lighting zones treat them as one)
const ROOM_ALIAS = { kitchenN: 'kitchen', coffee: 'reception' };
function roomAt(x, z) {
  for (const [k, r] of Object.entries(ROOMS)) if (x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1) return ROOM_ALIAS[k] || k;
  return 'out';
}

// ---------- LOOK: warm dusk (client style references). Sun just set, low behind the building, a little west.
const SUN_DIR = new THREE.Vector3(-0.36, 0.05, -0.93).normalize();

function makeSky() {
  const W = Q.sky, H = Q.sky / 2; const [c, g] = canvas(W, H);
  const img = g.createImageData(W, H); const d = img.data;
  const sunPhi = Math.atan2(SUN_DIR.z, SUN_DIR.x);
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const zen = [20, 34, 78], high = [40, 64, 128], midCool = [92, 106, 160], horCool = [150, 138, 168];
  const horWarm = [255, 168, 92], midWarm = [222, 142, 132];
  for (let y = 0; y < H; y++) {
    const el = (0.5 - y / H) * Math.PI, cy = Math.cos(el), sy = Math.sin(el);
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4, phi = (x / W - 0.5) * Math.PI * 2;
      const a = Math.cos(phi - sunPhi), w = Math.pow((a + 1) / 2, 3);
      let col;
      if (el > 0) {
        const t = Math.pow(sy, 0.45);
        const hor = mix(horCool, horWarm, w), mid = mix(midCool, midWarm, w * 0.75);
        col = t < 0.22 ? mix(hor, mid, t / 0.22) : t < 0.6 ? mix(mid, high, (t - 0.22) / 0.38) : mix(high, zen, (t - 0.6) / 0.4);
        const dot = cy * Math.cos(phi) * SUN_DIR.x + sy * SUN_DIR.y + cy * Math.sin(phi) * SUN_DIR.z;
        const glow = Math.pow(Math.max(0, dot), 24) * 0.55 + Math.pow(Math.max(0, dot), 5) * 0.18;
        col = mix(col, [255, 196, 128], Math.min(1, glow));
        const k = 1 / Math.max(0.06, Math.tan(el) + 0.05);
        const qx = Math.cos(phi) * k * 1.3, qz = Math.sin(phi) * k * 1.3;
        let cu = fbm(qx * 0.8 + 11, qz * 0.8 + 3, 6) - 0.57; cu = Math.max(0, cu) * 4.0;
        let ci = fbm(qx * 0.3 + 40, qz * 2.4, 5) - 0.54; ci = Math.max(0, ci) * 2.4;
        const cover = Math.min(1, (cu + ci * 0.7) * Math.min(1, el * 7));
        const lit = Math.min(1, Math.pow(w, 1.1) * (0.55 + 0.45 * (1 - t)) + 0.08);
        let cc = mix([52, 56, 88], [250, 150, 112], lit);
        cc = mix(cc, [255, 214, 170], Math.max(0, lit - 0.6) * 0.8 * (1 - Math.min(1, cu)));
        cc = mix(cc, [40, 42, 70], Math.min(0.5, Math.max(0, cu - 0.5) * 0.6));
        col = mix(col, cc, cover);
      } else col = [26, 26, 32];
      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = tex(c, true, false); t.mapping = THREE.EquirectangularReflectionMapping; return t;
}

// ---------- procedural textures
function pixTex(W, H, fn, srgb = true) {
  const [c, g] = canvas(W, H); const img = g.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = (y * W + x) * 4, v = fn(x, y); img.data[i] = v[0]; img.data[i + 1] = v[1]; img.data[i + 2] = v[2]; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return tex(c, srgb);
}
function makeAsphalt() {
  const S = 1024;
  const map = pixTex(S, S, (x, y) => {
    const n = fbm(x / 90, y / 90, 4, S / 90) * 0.5 + 0.5, gr = hash(x, y * 7 + 3);
    let v = 96 + (n - 0.75) * 22 + (gr - 0.5) * 34; if (gr > 0.985) v += 45; if (gr < 0.02) v -= 25;

function shellWall(axis, fixed, a0, a1, outward, gaps = [], WH = WALL_H) {

  if (cur < a1) pieces.push([cur, a1, 0]);

    const len = p1 - p0, mid = (p0 + p1) / 2, yb = gapH || 0, h = WH - yb;
    if (len < 0.01 || h < 0.01) continue;
    const off = fixed - outward * EXT_T / 2;   // the outer face sits on the plan line

    const outer = metalWall(len, h), mats = Array(6).fill(M.drywall);
    mats[axis === 'x' ? (outward > 0 ? 4 : 5) : (outward > 0 ? 0 : 1)] = outer;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
    m.position.set(axis === 'x' ? mid : off, yb + h / 2, axis === 'x' ? off : mid); m.castShadow = m.receiveShadow = true; scene.add(m);

      box(axis === 'x' ? len : 0.12, 1.45, axis === 'x' ? 0.12 : len, M.stone, sx, 0.725, sz, 1.6);
      box(axis === 'x' ? len : 0.16, 0.06, axis === 'x' ? 0.16 : len, M.cap, axis === 'x' ? mid : fixed + outward * 0.08, 1.48, axis === 'x' ? fixed + outward * 0.08 : mid);
    }
  }
}

    }
    wBox(ledStrip, 0.012, 0.012, zl - 0.1, SX1 + 0.004, SH - 0.045, zm);
    // stage ends: a slim black edge so the sides read finished from the exit-door pockets
    for (const z of [SZ0, SZ1]) wBox(M.blackMetal, SX1 - W0 + 2 * STEP, 0.03, 0.03, (W0 + SX1 + 2 * STEP) / 2, 0.015, z);
    addCollider(W0, SZ0, SX1 + 2 * STEP, SZ1);
  }

  // =====================================================================================================
  // STAGE WALL: core builds a tall window wall here (5 windows, sill 2.9, top 7.9). Charcoal band below the sills,
  // cedar slat panels flanking it, and a projection screen suspended in front of the glass.
  // =====================================================================================================
  const WF = W0 + 0.03;                                   // charcoal face
  const BAND0 = SZ0 - 0.3, BAND1 = SZ1 + 0.2, BH = 2.75;  // band z -34.75 .. -24.45 (clear of both exit-door frames)
  {
    wBox(M.charcoal, 0.03, BH, BAND1 - BAND0, W0 + 0.015, BH / 2, (BAND0 + BAND1) / 2);
    wBox(M.blackMetal, 0.05, 0.04, BAND1 - BAND0, W0 + 0.025, BH + 0.02, (BAND0 + BAND1) / 2);   // top reveal
    // cedar slat panels at both ends of the band, taller than it
    const panels = [[BAND0, BAND0 + 0.66], [BAND1 - 0.56, BAND1]];
    const sw = 0.07, gap = 0.028, sd = 0.04, y0 = 0, y1 = 4.7;
    for (const [a, b] of panels) {
      wBox(M.blackMetal, 0.02, y1 - y0, b - a, W0 + 0.01, (y0 + y1) / 2, (a + b) / 2);   // dark backer
      const n = Math.floor((b - a + gap) / (sw + gap)), off = (b - a - (n * sw + (n - 1) * gap)) / 2;
      for (let i = 0; i < n; i++) wBox(M.wood, sd, y1 - y0, sw, WF + sd / 2, (y0 + y1) / 2, a + off + sw / 2 + i * (sw + gap), 0, 0, 0, 2.2);
      wBox(M.wood, sd + 0.02, 0.06, b - a + 0.02, WF + sd / 2, y1 + 0.03, (a + b) / 2, 0, 0, 0, 2.2);   // cap
      lightShape(T.UP, WF + 0.05, SH + 2.0, (a + b) / 2, 1.5, 4.0, 0.6, Math.PI / 2);
      wBox(M.fixture, 0.12, 0.08, 0.16, WF + 0.22, SH + 0.04, (a + b) / 2);
      wBox(lens, 0.06, 0.012, 0.1, WF + 0.22, SH + 0.085, (a + b) / 2);
      halosX.push([WF + 0.27, SH + 0.12, (a + b) / 2, 0.45]);
    }
    // warm uplight scallops along the charcoal band
    for (const z of [ZC - 3.7, ZC - 1.6, ZC + 1.6, ZC + 3.7]) {
      lightShape(T.UP, WF + 0.012, SH + 1.0, z, 1.0, 2.0, 0.42, Math.PI / 2);
      wBox(M.fixture, 0.12, 0.08, 0.16, WF + 0.2, SH + 0.04, z);
      wBox(lens, 0.06, 0.012, 0.1, WF + 0.2, SH + 0.085, z);
      halosX.push([WF + 0.25, SH + 0.12, z, 0.35]);
    }
  }
  // projection screen (suspended in front of the window wall, glass visible around it)
  {
    const sw = 5.6, sh = sw * 9 / 16, yb = 3.08, yc = yb + sh / 2, sx = W0 + 0.45;
    const [c, g] = canvas(1600, 900);
    const bg = g.createRadialGradient(800, 380, 60, 800, 450, 980);
    bg.addColorStop(0, '#6b4a33'); bg.addColorStop(0.45, '#3a2a22'); bg.addColorStop(1, '#151214');
    g.fillStyle = bg; g.fillRect(0, 0, 1600, 900);
    // soft light rays + bokeh
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 7; i++) {
      const a = -0.9 + i * 0.3, gr = g.createLinearGradient(800, -100, 800 + Math.sin(a) * 1200, 1000);
      gr.addColorStop(0, 'rgba(255,200,140,0.10)'); gr.addColorStop(1, 'rgba(255,200,140,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(780, -60); g.lineTo(820, -60); g.lineTo(800 + Math.sin(a) * 1500 + 120, 1000); g.lineTo(800 + Math.sin(a) * 1500 - 120, 1000); g.fill();
    }
    let sd = 7;
    const rr = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < 46; i++) {
      const x = rr() * 1600, y = 520 + rr() * 380, r = 12 + rr() * 46, gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(255,${180 + (rr() * 50) | 0},120,${0.12 + rr() * 0.12})`); gr.addColorStop(1, 'rgba(255,190,120,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    const serif = document.fonts && document.fonts.check('600 80px Cinzel') ? '"Cinzel", Georgia, serif' : 'Georgia, "Times New Roman", serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(255,190,120,0.55)'; g.shadowBlur = 30;
    g.fillStyle = '#fff7ec'; g.font = `italic 400 150px Georgia, "Times New Roman", serif`;
    g.fillText('Welcome Home', 800, 395);
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(255,226,190,0.85)'; g.fillRect(650, 500, 300, 3);
    g.font = `600 54px ${serif}`; if ('letterSpacing' in g) g.letterSpacing = '12px';
    g.fillStyle = '#f2dcc0'; g.fillText('TRINITY BIBLE CHURCH', 806, 585);
    if ('letterSpacing' in g) g.letterSpacing = '6px';
    g.font = `400 30px "Segoe UI", system-ui, sans-serif`; g.fillStyle = 'rgba(242,220,192,0.7)'; g.fillText('WORSHIP  ·  SUNDAYS 10:30 AM', 803, 660);
    const t = tex(c, true, false);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), std({ color: 0x000000, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 1.05, roughness: 0.9 }));
    scr.rotation.y = Math.PI / 2; scr.position.set(sx + 0.006, yc, ZC); scene.add(scr);
    wBox(M.blackMetal, 0.05, sh + 0.14, sw + 0.14, sx - 0.022, yc, ZC);                 // frame / back
    wBox(M.blackMetal, 0.14, 0.14, sw + 0.4, sx - 0.03, yb + sh + 0.14, ZC);              // roller housing
    for (const s of [-1, 1]) { const z = ZC + s * (sw / 2 - 0.2); wRod(M.blackMetal, [sx - 0.03, yb + sh + 0.2, z], [sx - 0.03, ceilY(z) - 0.15, z], 0.006, 4); }
  }

  // =====================================================================================================
  // ROOF STRUCTURE: pitched cedar glulam rafters on glulam wall columns (every frame line), knee braces and a
  // high collar + king post near the ridge (nothing low across the room), ridge beam, purlins, black steel plates
  // =====================================================================================================
  const up = new THREE.Vector3(0, 1, 0), upX = new THREE.Vector3(1, 0, 0);
  const zAtY = (y, side) => {   // z on the north (-1) / south (+1) pitch where ceilY(z) == y
    let a = ZC, b = side < 0 ? N0 : S0;
    for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (ceilY(m) > y) a = m; else b = m; }
    return (a + b) / 2;
  };
  const RD = 0.7, RW = 0.3;                                    // rafter depth / width
  const yR = z => ceilY(z) - 0.08 - RD / 2;                    // rafter centre height (top just under the deck)
  const MECH_N = -21.565, MECH_E = -17.915;                                       // north face of the mechanical room (SW corner)
  for (const x of TRUSS_X) {
    for (const side of [-1, 1]) {
      const zw = side < 0 ? N0 : (x < MECH_E ? MECH_N : S0);   // the west line lands on the mechanical room wall
      const zc = zw - side * 0.18;                             // column centre (0.36 deep against the wall)
      const yTop = yR(zc) - RD / 2 + 0.05;
      wBox(M.wood, 0.3, yTop, 0.36, x, yTop / 2, zc, 0, 0, 0, 2.2);                                   // glulam column
      wBox(M.blackMetal, 0.36, 0.12, 0.42, x, 0.06, zc);                                              // steel base shoe
      wBeam(M.wood, [x, yR(zc), zc], [x, yR(ZC), ZC], RW, RD, up);                                    // pitched rafter
      const zk = zc - side * 1.9, yk = yTop - 1.7;                                                    // knee brace
      wBeam(M.wood, [x, yk, zc - side * 0.1], [x, yR(zk) - 0.2, zk], 0.2, 0.22, upX);
      for (const b of [-1, 1]) {
        wBox(M.blackMetal, 0.012, 0.9, 0.7, x + b * (RW / 2 + 0.006), yTop - 0.15, zc - side * 0.2);   // knee plates
        for (const [dz, dy] of [[-0.18, 0.1], [0.18, 0.1], [-0.18, -0.3], [0.18, -0.3]]) wCyl(M.blackMetal, 0.02, 0.02, 0.016, x + b * (RW / 2 + 0.014), yTop - 0.15 + dy, zc - side * 0.2 + dz, 0, 0, Math.PI / 2, null, 8);
      }
    }
    // high collar + short king post (about 10.3 m up; well above any ball flight)
    const yc = 10.25, zn = zAtY(yc + 0.6, -1), zs = zAtY(yc + 0.6, 1);
    wBeam(M.wood, [x, yc, zn], [x, yc, zs], 0.2, 0.36, up);
    wBeam(M.wood, [x, yc + 0.18, ZC], [x, yR(ZC) - 0.1, ZC], 0.2, 0.24, upX);
    for (const b of [-1, 1]) {
      wBox(M.blackMetal, 0.012, 0.9, 0.9, x + b * (RW / 2 + 0.006), ceilY(ZC) - 0.55, ZC);             // ridge plate
      for (const z of [zn, zs]) wBox(M.blackMetal, 0.012, 0.5, 0.5, x + b * 0.106, yc + 0.05, z + (z < ZC ? 0.2 : -0.2));
    }
  }
  wBeam(M.wood, [W0, ceilY(ZC) - 0.3, ZC], [E0, ceilY(ZC) - 0.3, ZC], 0.3, 0.45, up);               // ridge beam
  for (const [side, f] of [[-1, 0.34], [-1, 0.68], [1, 0.3], [1, 0.62]]) {                          // purlins
    const z = ZC + side * f * (side < 0 ? ZC - N0 : S0 - ZC);
    wBeam(M.wood, [W0, ceilY(z) - 0.14, z], [E0, ceilY(z) - 0.14, z], 0.16, 0.26, up);
  }

  // =====================================================================================================
  // SIDE WALLS: grey block wainscot, light-grey acoustic panels between the columns, up/down sconces
  // =====================================================================================================
  {
    const blockMat = (() => {   // 0.4 x 0.2 m ground-face block, running bond; canvas = 1.6 x 1.6 m
      const [c, g] = canvas(512, 512); g.fillStyle = '#8f8b85'; g.fillRect(0, 0, 512, 512);
      let sd = 3; const rr = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
      for (let r = 0; r < 8; r++) for (let k = -1; k < 5; k++) {
        const x = k * 128 + (r % 2) * 64, v = 150 + (rr() * 26) | 0;
        g.fillStyle = `rgb(${v},${v - 3},${v - 8})`; g.fillRect(x + 2, r * 64 + 2, 124, 60);
        for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(${rr() < 0.5 ? '255,255,250' : '60,58,54'},0.12)`; g.fillRect(x + 2 + rr() * 122, r * 64 + 2 + rr() * 58, 2, 2); }
      }
      return std({ map: tex(c, true, true), roughness: 0.88 });
    })();
    const WH = 1.22;
    const runX = (x0, x1, zf, s) => { if (x1 - x0 < 0.05) return;   // along a north/south wall face zf, s = into-room sign
      wBox(blockMat, x1 - x0, WH, 0.04, (x0 + x1) / 2, WH / 2, zf + s * 0.02, 0, 0, 0, 1.6);
      wBox(M.cap, x1 - x0, 0.04, 0.07, (x0 + x1) / 2, WH + 0.02, zf + s * 0.035);
    };
    const runZ = (z0, z1, xf, s) => { if (z1 - z0 < 0.05) return;
      wBox(blockMat, 0.04, WH, z1 - z0, xf + s * 0.02, WH / 2, (z0 + z1) / 2, 0, 0, 0, 1.6);
      wBox(M.cap, 0.07, 0.04, z1 - z0, xf + s * 0.035, WH + 0.02, (z0 + z1) / 2);
    };
    // north wall (storage doors kept), south wall (east of the mech room), mech room faces, west wall pockets
    for (const [a, b] of [[W0, -15.42], [-14.32, -9.45], [-8.37, E0]]) runX(a, b, N0, 1);
    runX(MECH_E, E0, S0, -1);
    for (const [a, b] of [[W0, -20.68], [-19.52, MECH_E]]) runX(a, b, MECH_N, -1);
    runZ(MECH_N, S0, MECH_E, 1);
    for (const [a, b] of [[N0, -37.615], [-35.625, BAND0], [-22.115, MECH_N]]) runZ(a, b, W0, 1);
    // acoustic panels (fabric-wrapped, light grey) between the columns, below the clerestories
    const fabric = std({ color: 0xcdc9c2, roughness: 1 });
    const panelX = (xc, w, zf, s) => { wBox(fabric, w, 2.7, 0.05, xc, 2.65 + 1.35, zf + s * 0.025); wBox(M.blackMetal, w + 0.02, 0.012, 0.03, xc, 2.64, zf + s * 0.04); };
    for (const s of [-1, 1]) {
      const zf = s < 0 ? N0 : S0, si = -s;
      panelX(-14.25, 2.6, zf, si); panelX(-5.78, 1.5, zf, si);
      if (s < 0) panelX(-19.06, 2.6, zf, si); else panelX(-19.8, 2.2, MECH_N, -1);
    }
    // up/down sconces just east of each column
    const sconce = (x, zf, s) => {
      const y = 3.0, rot = s > 0 ? 0 : Math.PI;
      wBox(M.fixture, 0.15, 0.36, 0.13, x, y, zf + s * 0.065);
      wBox(lens, 0.1, 0.02, 0.08, x, y + 0.185, zf + s * 0.065); wBox(lens, 0.1, 0.02, 0.08, x, y - 0.185, zf + s * 0.065);
      lightShape(T.WASH, x, y, zf + s * 0.045, 1.6, 4.4, 0.45, rot);
    };
    for (const x of TRUSS_X) {
      sconce(x + 0.8, N0, 1);
      if (x > MECH_E) sconce(x + 0.8, S0, -1);
    }
  }

  // =====================================================================================================
  // BASKETBALL: two wall-mounted hoops facing each other across the room (court runs north-south)
  // =====================================================================================================
  {
    const orange = std({ color: 0xd9531c, roughness: 0.45, metalness: 0.3 });
    const white = std({ color: 0xf2f0ea, roughness: 0.6 });
    const netMat = (() => {
      const [c, g] = canvas(128, 64); g.clearRect(0, 0, 128, 64); g.strokeStyle = '#fff'; g.lineWidth = 3;
      for (let i = -4; i < 12; i++) { g.beginPath(); g.moveTo(i * 16, 0); g.lineTo(i * 16 + 32, 64); g.stroke(); g.beginPath(); g.moveTo(i * 16 + 32, 0); g.lineTo(i * 16, 64); g.stroke(); }
      const t = tex(c, true, true); t.repeat.set(2, 1);
      return std({ map: t, color: 0xffffff, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide, roughness: 0.9 });
    })();
    const HX = -9.41;                           // between two clerestories, over the middle of the seating
    for (const s of [1, -1]) {                  // s = into-room direction (+z on the north wall, -z on the south)
      const zf = s > 0 ? N0 : S0, zb = zf + s * 1.35, yb = 2.9;
      const at = (dx, y, d) => [HX + dx, y, zf + s * d];
      for (const dx of [-0.2, 0.2]) {
        wBox(M.blackMetal, 0.09, 4.3, 0.09, HX + dx, 2.6 + 2.15, zf + s * 0.06);                      // wall posts
        wRod(M.blackMetal, at(dx, 6.75, 0.08), at(dx * 2.4, yb + 1.07, 1.3), 0.03, 8);                 // long diagonal stays
        wRod(M.blackMetal, at(dx, 2.95, 0.08), at(dx * 2.4, yb + 0.05, 1.3), 0.035, 8);                // lower arms
        wRod(M.blackMetal, at(dx, 4.3, 0.08), at(dx * 2.4, yb + 0.05, 1.3), 0.022, 6);                 // cross brace
        for (const y of [2.75, 6.7]) wBox(M.blackMetal, 0.22, 0.22, 0.02, HX + dx, y, zf + s * 0.01);  // wall plates
      }
      wBox(M.blackMetal, 1.1, 0.06, 0.06, HX, yb + 1.07, zb - s * 0.06); wBox(M.blackMetal, 1.1, 0.06, 0.06, HX, yb + 0.05, zb - s * 0.06);
      // glass backboard 1.83 x 1.07 with aluminium edge and the white shooter's square
      wBox(acrylic, 1.83, 1.07, 0.025, HX, yb + 0.535, zb);
      for (const [w, h, y, x] of [[1.85, 0.035, yb + 1.07, 0], [1.85, 0.035, yb, 0], [0.035, 1.07, yb + 0.535, -0.915], [0.035, 1.07, yb + 0.535, 0.915]])
        wBox(chrome, w, h, 0.035, HX + x, y, zb);
      wBox(orange, 1.83, 0.09, 0.07, HX, yb - 0.02, zb);                                              // bottom edge pad
      for (const [w, h, y, x] of [[0.59, 0.05, yb + 0.15 + 0.45, 0], [0.59, 0.05, yb + 0.175, 0], [0.05, 0.45, yb + 0.375, -0.27], [0.05, 0.45, yb + 0.375, 0.27]])
        wBox(white, w, h, 0.006, HX + x, y, zb + s * 0.016);
      // rim (3.05 m), bracket, net
      const rz = zb + s * (0.15 + 0.2286);
      wPut(orange, new THREE.TorusGeometry(0.2286, 0.01, 6, 28), HX, 3.05, rz, Math.PI / 2, 0, 0);
      wBox(orange, 0.16, 0.03, 0.17, HX, 3.04, zb + s * 0.085);
      wBox(orange, 0.16, 0.14, 0.012, HX, 3.0, zb + s * 0.012);
      wPut(netMat, new THREE.CylinderGeometry(0.225, 0.14, 0.42, 16, 1, true), HX, 3.05 - 0.21, rz);
    }
  }

  // =====================================================================================================
  // LIGHTING TRUSS over the stage edge, with hanging fixtures; line arrays at both sides
  // =====================================================================================================
  {
    const tx = SX1 - 0.15, ty = 7.7, z0 = SZ0 - 0.35, z1 = SZ1 + 0.35, hw = 0.15;
    const chords = [[-hw, -hw], [-hw, hw], [hw, -hw], [hw, hw]];
    for (const [dx, dy] of chords) wRod(M.blackMetal, [tx + dx, ty + dy, z0], [tx + dx, ty + dy, z1], 0.024, 8);
    const bay = 0.5, nb = Math.round((z1 - z0) / bay);
    for (let i = 0; i < nb; i++) {
      const za = z0 + i * (z1 - z0) / nb, zb = za + (z1 - z0) / nb;
      for (const [a, b] of [[[-hw, -hw], [-hw, hw]], [[hw, -hw], [hw, hw]], [[-hw, -hw], [hw, -hw]], [[-hw, hw], [hw, hw]]]) {
        const fl = i % 2 ? [a, b] : [b, a];
        wRod(M.blackMetal, [tx + fl[0][0], ty + fl[0][1], za], [tx + fl[1][0], ty + fl[1][1], zb], 0.01, 5);
      }
    }
    for (const z of [z0, z1]) wBox(M.blackMetal, 0.36, 0.36, 0.04, tx, ty, z);
    for (const z of [z0 + 1.2, (z0 + z1) / 2, z1 - 1.2]) wRod(M.blackMetal, [tx, ty + hw, z], [tx, ceilY(z), z], 0.008, 4);   // hoist cables
    // moving-head / profile fixtures hanging from the bottom chords, aimed at the platform
    const nF = 10;
    for (let i = 0; i < nF; i++) {
      const z = z0 + 0.6 + i * (z1 - z0 - 1.2) / (nF - 1), y = ty - hw;
      const pm = wMat(tx, y, z, 0, 0, 0);
      wBox(M.blackMetal, 0.06, 0.06, 0.14, 0, -0.03, 0, 0, 0, 0, 0, pm);             // clamp
      wBox(M.blackMetal, 0.04, 0.24, 0.3, 0, -0.17, 0, 0, 0, 0, 0, pm);              // yoke
      const bm = wMat(tx, y - 0.3, z, 0, 0, -0.55);
      wCyl(M.blackMetal, 0.11, 0.09, 0.32, 0, 0, 0, 0, 0, 0, bm, 12);
      wCyl(M.blackMetal, 0.115, 0.115, 0.04, 0, -0.17, 0, 0, 0, 0, bm, 12);
      wPut(lens, new THREE.CircleGeometry(0.08, 12), 0, -0.192, 0, Math.PI / 2, 0, 0, 1, 1, 1, bm);
    }
    // line-array speaker hangs at both front corners (6 cabinets, gentle J curve)
    for (const z of [SZ0 - 0.75, SZ1 + 0.75]) {
      const x = SX1 + 0.25, top = 8.7;
      wBox(M.blackMetal, 0.55, 0.06, 0.82, x, top, z);                                     // fly frame
      for (const dz of [-0.33, 0.33]) wRod(M.blackMetal, [x, top, z + dz], [x, ceilY(z) - 0.02, z + dz], 0.008, 4);
      let y = top - 0.04, ang = 0.0;
      for (let k = 0; k < 6; k++) {
        ang += 0.035 + k * 0.022; const h = 0.27;
        const cm = wMat(x, y - h / 2, z, 0, 0, -ang);
        wBox(M.blackMetal, 0.5, h - 0.012, 0.8, 0, 0, 0, 0, 0, 0, 0, cm);
        wBox(grille, 0.012, h - 0.04, 0.76, 0.252, 0, 0, 0, 0, 0, 0, cm);
        y -= h * Math.cos(ang);
      }
    }
  }

  // =====================================================================================================
  // PLATFORM FURNISHINGS: pulpit, drum kit + shield, keyboard, guitars, monitors, plants
  // =====================================================================================================
  // --- pulpit (cedar box with a sloped reading top and a dark inset band)
  {
    const x = SX1 - 0.95, z = ZC, y0 = SH;
    wBox(M.wood, 0.5, 1.02, 0.7, x, y0 + 0.51, z, 0, 0, 0, 2.2);
    wBox(M.wood, 0.56, 0.06, 0.78, x, y0 + 0.03, z, 0, 0, 0, 2.2);                      // plinth
    wBox(M.charcoal, 0.01, 0.82, 0.08, x + 0.252, y0 + 0.52, z);                         // dark vertical inlay

  // ======================================================================================

  {

// ----- module: rooms.js -----
function buildRooms(C) {

    gloss: std({ vertexColors: true, roughness: 0.42 }),                      // painted / plastic parts

    brass: std({ color: 0xb08d57, roughness: 0.32, metalness: 0.9 }),

    for (let r = 0; r < 4; r++) for (let k = -1; k < 3; k++) {

  const _col = new THREE.Color();

  }

    const prev = XF, m = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ'));

    const idx = nv > 65000 ? new Uint32Array(ni) : new Uint16Array(ni);

      if (col) { _col.setHex(c); for (let i = 0; i < cnt; i++) { col[(vo + i) * 3] = _col.r; col[(vo + i) * 3 + 1] = _col.g; col[(vo + i) * 3 + 2] = _col.b; } }
      if (g.index) { const a = g.index.array; for (let k = 0; k < a.length; k++) idx[io + k] = a[k] + vo; io += a.length; }

    return put(g, mat, color);
  }
  function sph(r, mat, x, y, z, sx = 1, sy = 1, sz = 1, color, det = 1) {
    const g = new THREE.IcosahedronGeometry(r, det); g.scale(sx, sy, sz); g.translate(x, y, z); return put(g, mat, color);
  }
  function disc(r, mat, x, y, z, color, sx = 1, sz = 1, seg = 24) {   // horizontal disc facing up
    const g = new THREE.CircleGeometry(r, seg); g.rotateX(-HP); g.scale(sx, 1, sz); g.translate(x, y, z); return put(g, mat, color);
  }

    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;

      const m = Math.round(Math.min(w, h) * 0.1), iw = w - 2 * m, ih = h - 2 * m; g.save(); g.translate(m, m);

      sg.addColorStop(0, 'rgba(255,240,210,.95)'); sg.addColorStop(0.12, 'rgba(255,226,180,.8)'); sg.addColorStop(1, 'rgba(255,200,150,0)');

        g.fillStyle = pal[3 + k]; g.beginPath(); g.moveTo(0, ih);
        for (let x = 0; x <= iw; x += 4) g.lineTo(x, base - amp * (Math.sin(x / iw * f1 * PI + ph) * 0.7 + Math.sin(x / iw * f2 * PI + ph * 2) * 0.3));

    };
  }
  function colorField(cols) {
    return (g, w, h) => {
      g.fillStyle = '#f3eee5'; g.fillRect(0, 0, w, h);
      const m = Math.round(Math.min(w, h) * 0.1); g.fillStyle = cols[0]; g.fillRect(m, m, w - 2 * m, h - 2 * m);

  const PAPER = ['#fffdf7', '#fdf2c7', '#e6efdf', '#fbe1d6', '#e1eaf3', '#f6e7f0'];
  const CRAY = ['#d9534f', '#e98b2a', '#e7c23b', '#5aa05a', '#3d7cc9', '#8a5cc2', '#c2577f', '#6b4a2b'];
  function kidDrawing(g, x, y, w, h, kind) {

  const p = dollRay.ray.origin.clone().addScaledVector(dollRay.ray.direction, t);
  if (roomAt(p.x, p.z) === 'out' && !(p.x > BX0 - 40 && p.x < BX1 + 40 && p.z > BZN - 40 && p.z < 30)) return;
  player.pos.set(p.x, EYE, p.z); player.vel.set(0, 0, 0); collide(player.pos); player.pitch = 0;
  setDoll(false); toast(roomAt(p.x, p.z) === 'out' ? 'Outside' : 'Walking: ' + roomAt(p.x, p.z));
}
function dollFrame(dt) {
  const cp = Math.cos(DOLL.pitch), tgt = new THREE.Vector3(DOLL.cx, 0, DOLL.cz);
  camera.position.set(DOLL.cx + Math.sin(DOLL.yaw) * cp * DOLL.dist, Math.sin(DOLL.pitch) * DOLL.dist, DOLL.cz + Math.cos(DOLL.yaw) * cp * DOLL.dist);
  camera.lookAt(tgt);
  const k = 1 - Math.exp(-dt * 4), a = AMB_DOLL;
  hemi.color.lerp(a.hemiSky, k); hemi.groundColor.lerp(a.hemiGround, k); hemi.intensity += (a.hemi - hemi.intensity) * k;
  scene.environmentIntensity += (a.env - scene.environmentIntensity) * k; sun.intensity += (a.sun - sun.intensity) * k; fill.intensity += (a.fill - fill.intensity) * k;
  if (performance.now() - lastAssign > 500) { assignLights(new THREE.Vector3(DOLL.cx + 6, EYE, DOLL.cz)); lastAssign = performance.now(); }
}
// --- guided tour: fade into each room, take a slow look around, move on; loops forever (lobby display: ?kiosk=1)
const TOUR = [   // plan feet (x from west wall, y from north wall), facing (deg, 0 = north, 90 = west), sweep (deg), caption
  { out: true, x: -3, z: 14, yaw: -8.5, sweep: 50, t: 16, cap: 'Trinity Bible Church' },
  { x: 72, y: 82, yaw: 0, sweep: 110, t: 14, cap: 'Vestibule' },
  { x: 72, y: 70, yaw: 0, sweep: 230, t: 22, cap: 'Fellowship Hall' },
  { x: 46, y: 52, yaw: 90, sweep: 170, t: 24, cap: 'Worship / Gym' },
  { x: 64, y: 20, yaw: 0, sweep: 200, t: 18, cap: 'Kitchen' },
  { x: 74, y: 30, yaw: 90, sweep: 200, t: 18, cap: 'Bookstore & Reception' },
  { x: 82.5, y: 13, yaw: 60, sweep: 130, t: 18, cap: "Pastor's Office" },
  { x: 94, y: 18.5, yaw: 0, sweep: 200, t: 18, cap: 'Family Bible Fellowship' },
  { x: 116, y: 19, yaw: 0, sweep: 200, t: 18, cap: "Children's Classroom" },
  { x: 104.5, y: 35.8, yaw: -90, sweep: 100, t: 16, cap: 'Flex Room 1' },
  { x: 104.5, y: 51, yaw: -90, sweep: 100, t: 16, cap: 'Flex Room 2' },
  { x: 112, y: 71, yaw: 0, sweep: 200, t: 18, cap: 'Nursery' },
  { doll: true, t: 28, cap: 'The whole building' },
];
const AUTO = { on: false, i: -1, t: 0, kiosk: P.get('kiosk') === '1', fading: false };
const autoBtn = document.getElementById('auto'), fadeEl = document.getElementById('fade'), capEl = document.getElementById('roomcap');
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function tourGo(i) {
  AUTO.fading = true; fadeEl.classList.add('on'); capEl.classList.remove('on');
  setTimeout(() => {
    if (!AUTO.on) return;
    AUTO.i = i % TOUR.length; AUTO.t = 0; const s = TOUR[AUTO.i];
    if (s.doll) { setDoll(true, true); DOLL.dist = 70; DOLL.pitch = deg(38); DOLL.yaw = deg(-30); }
    else {
      if (DOLL.on) setDoll(false);
      const x = s.out ? s.x : px(s.x), z = s.out ? s.z : pz(s.y);
      player.pos.set(x, EYE, z); player.vel.set(0, 0, 0); player.pitch = deg(-4); player.yaw = deg(s.yaw - s.sweep / 2);
    }
    capEl.textContent = s.cap;
    setTimeout(() => { fadeEl.classList.remove('on'); capEl.classList.add('on'); AUTO.fading = false; }, 150);
  }, 950);
}
function setAuto(on) {
  AUTO.on = on; document.body.classList.toggle('touring', on); autoBtn.classList.toggle('on', on); autoBtn.setAttribute('aria-pressed', on);
  if (on) tourGo(AUTO.i + 1);
  else { fadeEl.classList.remove('on'); capEl.classList.remove('on'); GLIDE.on = false; }
}
function autoFrame(dt) {   // returns true while the tour owns the camera
  if (!AUTO.on || AUTO.i < 0) return false;
  const s = TOUR[AUTO.i]; AUTO.t += dt; const k = Math.min(1, AUTO.t / s.t);
  if (s.doll) { DOLL.yaw += dt * (Math.PI * 2 / s.t) * 0.6; dollFrame(dt); }
  else {
    player.yaw = deg(s.yaw - s.sweep / 2 + s.sweep * ease(k));
    player.pitch = deg(-4 + 2 * Math.sin(k * Math.PI));
    camera.position.set(player.pos.x, EYE, player.pos.z); camera.rotation.set(player.pitch, player.yaw, 0);
    updateZone(dt, player.pos);
  }
  if (k >= 1 && !AUTO.fading) tourGo(AUTO.i + 1);
  return true;
}
autoBtn.addEventListener('click', e => { e.stopPropagation(); setAuto(!AUTO.on); });
// any touch, click or key hands control back (except on the lobby display)
const stopAuto = () => { if (AUTO.on && !AUTO.kiosk) { setAuto(false); if (DOLL.on) setDoll(false); } };
view.addEventListener('pointerdown', stopAuto); document.getElementById('stick').addEventListener('pointerdown', stopAuto);
addEventListener('keydown', e => { if (e.code !== 'KeyV') stopAuto(); });
if (P.get('stop')) AUTO.i = +P.get('stop') - 1;   // dev: start the tour at a given stop
if (AUTO.kiosk) { document.body.classList.add('shot'); setTimeout(() => setAuto(true), 600); }

if (P.get('doll') === '1') { setDoll(true); if (P.get('dd')) DOLL.dist = +P.get('dd'); if (P.get('dy')) DOLL.yaw = deg(+P.get('dy')); }
const hint = document.getElementById('hint');
hint.textContent = COARSE ? 'Double tap where you want to go · drag to look · joystick to walk · tap a glass or folding wall to open it'
                          : 'Double click where you want to go · drag to look · W A S D to walk · click a glass or folding wall (or press E) to open it';
let hintTimer = setTimeout(() => hint.classList.add('gone'), 12000);
function interacted() { if (!hint.dataset.t) { hint.dataset.t = 1; clearTimeout(hintTimer); hintTimer = setTimeout(() => hint.classList.add('gone'), 3500); } }

// --- per-frame movement
let fps = 0;
function walk(dt) {
  let fx = 0, sx = 0;
  const m = Math.hypot(joy.x, joy.y);
  if (m > 0.12) { const k = Math.pow((m - 0.12) / 0.88, 1.4) / m; sx += joy.x * k; fx -= joy.y * k; }
  if (keys.has('KeyW') || keys.has('ArrowUp')) fx += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) fx -= 1;
  if (keys.has('KeyD')) sx += 1;
  if (keys.has('KeyA')) sx -= 1;
  if (keys.has('ArrowLeft')) player.yaw += deg(95) * dt;
  if (keys.has('ArrowRight')) player.yaw -= deg(95) * dt;
  const run = keys.has('ShiftLeft') || keys.has('ShiftRight');
  const n = Math.hypot(fx, sx); if (n > 1) { fx /= n; sx /= n; }
  const speed = run ? 4.2 : 2.0;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const tx = (-sy * fx + cy * sx) * speed, tz = (-cy * fx - sy * sx) * speed;
  const a = 1 - Math.exp(-dt * 9);
  player.vel.x += (tx - player.vel.x) * a; player.vel.z += (tz - player.vel.z) * a;
  player.pos.x += player.vel.x * dt; player.pos.z += player.vel.z * dt;
  collide(player.pos);
  const v = Math.hypot(player.vel.x, player.vel.z);
  player.phase += v * dt * 3.6;
  camera.position.set(player.pos.x, EYE + Math.sin(player.phase) * 0.022 * Math.min(1, v / 1.5), player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0);
  updateZone(dt, player.pos);
  if (P.get('hud') === '1') document.getElementById('hud').textContent = `x ${player.pos.x.toFixed(1)}  z ${player.pos.z.toFixed(1)}  ${roomAt(player.pos.x, player.pos.z)}  ${fps} fps`;
}
window.__player = player; window.__walk = walk; window.__roomAt = roomAt; window.__COLL = COLL;   // test hooks

// --- view size: ~95° horizontal FOV in landscape, capped vertical FOV in portrait
function fit() {
  const w = innerWidth, h = innerHeight; camera.aspect = w / h;
  camera.fov = clamp(2 * Math.atan(Math.tan(deg(47.5)) / camera.aspect) * 180 / Math.PI, 58, 88);
  camera.updateProjectionMatrix(); renderer.setSize(w, h); composer.setSize(w, h);
}
addEventListener('resize', fit); window.visualViewport?.addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));
fit();
if (P.get('open') === '1') for (const p of PARTITIONS) { p.t = p.target = 1; p.apply(1); }   // dev: start with partitions open
// settle lighting at the start position instantly (no fade-in on load)
assignLights(player.pos); for (let i = 0; i < 40; i++) updateZone(0.1, player.pos);

// ---------- Eddy, the Edwardsburg mascot, celebrating in place at the west end of the north storage room
let eddyMixer = null, eddy = null;
{
  const ex = px(0) + EXT_T + 1.45, ez = pz(0) + EXT_T + 0.85;
  const loadEddy = (url, next) => new GLTFLoader().load(url, onEddy, undefined, () => next && loadEddy(next));
  const onEddy = g => {
    eddy = g.scene; eddy.scale.setScalar(1.80 / 1.69); eddy.position.set(ex, 0, ez); eddy.rotation.y = 1.4;   // 5'-11" tall, faces east toward the doors
    eddy.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = true; o.frustumCulled = false; } });
    const clip = g.animations.find(a => /agree|celebr|dance/i.test(a.name)) || g.animations[0];
    if (clip) {
      for (const t of clip.tracks) if (t.name.endsWith('.position')) {   // keep him on his spot: lock any root drift in x and z
        const v = t.values, x0 = v[0], z0 = v[2]; for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; }
      }
      eddyMixer = new THREE.AnimationMixer(eddy); eddyMixer.clipAction(clip).play();
    }
    scene.add(eddy); window.__eddy = eddy;
  };
  loadEddy('eddy.glb', 'https://gebsierra.github.io/10000reasons/tour/eddy.glb');   // the Claude preview can't host .glb, so it falls back to the site copy
  addFixture(ex + 0.6, 2.5, ez + 0.6, { intensity: 6, distance: 6, room: 'storage' });
}

document.getElementById('loading').remove();
let last = performance.now(), fpsN = 0, fpsT = last;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsN++; if (now - fpsT > 1000) { fps = Math.round(fpsN * 1000 / (now - fpsT)); fpsN = 0; fpsT = now; }
  animatePartitions(dt);
  if (eddyMixer) eddyMixer.update(dt);
  if (eddy) eddy.visible = !DOLL.on;   // only seen by walking into the room
  if (autoFrame(dt)) {}
  else if (DOLL.on) dollFrame(dt);
  else if (!glideStep(dt) || (joy.x || joy.y || keys.size)) { GLIDE.on = false; walk(dt); }
  composer.render();
  window.__rendered = (window.__rendered || 0) + 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
